[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "andy-media-player"
version = "0.0.1"
description = "A local, private-by-design image and video viewer"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*"]
authors = [{name = "Andrew Hodgson trading as Wolf Forge"}]
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials==6.12.0", "python-mpv==1.0.8", "PyOpenGL==3.1.10"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1", "imageio-ffmpeg==0.6.0", "Pillow==13.0.0"]

[project.scripts]
amp = "amp.app:main"

[tool.setuptools.packages.find]
include = ["amp*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
