name: Package previews

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        format: [deb, appimage]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2 libegl1 libopengl0 libgl1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxkbcommon-x11-0 xvfb xauth pulseaudio pulseaudio-utils rpm cpio squashfs-tools
      - name: Install pinned application and build dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-linux-build.txt
      - name: Build Linux ${{ matrix.format }} preview
        run: python tools/build_linux_deb.py --format ${{ matrix.format }} --output artifacts/github-linux
      - name: Exercise the packaged Linux player
        run: |
          python tools/release_fixtures.py --output artifacts/release-fixtures
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=amp_test
          mkdir -p artifacts/linux-package-smoke
          case "${{ matrix.format }}" in
            deb) dpkg-deb -x artifacts/github-linux/*.deb artifacts/linux-package-smoke/extracted ;;
            rpm) mkdir -p artifacts/linux-package-smoke/extracted
                 rpm2cpio artifacts/github-linux/*.rpm | (cd artifacts/linux-package-smoke/extracted && cpio -idm) ;;
            appimage) (cd artifacts/linux-package-smoke && ../github-linux/*.AppImage --appimage-extract)
                      mv artifacts/linux-package-smoke/squashfs-root artifacts/linux-package-smoke/extracted ;;
          esac
          find artifacts/linux-package-smoke/extracted -name libqxcb.so -exec ldd {} \;
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 QT_QPA_PLATFORM=xcb PULSE_SINK=amp_test artifacts/linux-package-smoke/extracted/opt/amp/AMP --self-test --output artifacts/linux-package-smoke/results --video "$PWD/artifacts/release-fixtures/av.mp4" --music "$PWD/artifacts/release-fixtures/tone.wav"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AMP-Linux-${{ matrix.format }}-amd64-${{ github.sha }}
          path: |
            artifacts/github-linux/*.deb
            artifacts/github-linux/*.rpm
            artifacts/github-linux/*.AppImage
            artifacts/github-linux/*.log
            artifacts/github-linux/report.json
            artifacts/linux-package-smoke/results/*
          if-no-files-found: error

  fedora-rpm:
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install Fedora build and desktop test dependencies
        run: |
          dnf install -y git python3 python3-devel python3-pip binutils rpm-build desktop-file-utils mpv-libs libglvnd-egl libglvnd-opengl libglvnd-glx xcb-util-cursor xcb-util-wm xcb-util-keysyms xcb-util-image xcb-util-renderutil libxkbcommon-x11 mesa-dri-drivers xorg-x11-server-Xvfb xauth pulseaudio pulseaudio-utils cpio findutils which tar gzip
      - uses: actions/checkout@v4
      - name: Install pinned application and build tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]"
          .venv/bin/python -m pip install -r requirements-linux-build.txt
      - name: Build Fedora 44 RPM preview
        run: .venv/bin/python tools/build_linux_rpm.py --output artifacts/github-fedora
      - name: Install and exercise the packaged Fedora player
        run: |
          .venv/bin/python tools/release_fixtures.py --output artifacts/fedora-fixtures --video-codec libvpx-vp9
          dnf install -y artifacts/github-fedora/*.rpm
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=amp_test
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 QT_QPA_PLATFORM=xcb PULSE_SINK=amp_test /usr/bin/amp --self-test --output artifacts/fedora-package-smoke --video "$PWD/artifacts/fedora-fixtures/av.mp4" --music "$PWD/artifacts/fedora-fixtures/tone.wav"
          rpm -V amp-media-player
          dnf remove -y amp-media-player
          test ! -e /opt/amp/AMP
          test ! -e /usr/bin/amp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AMP-Fedora44-x86_64-${{ github.sha }}
          path: |
            artifacts/github-fedora/*.rpm
            artifacts/github-fedora/*.log
            artifacts/github-fedora/report.json
            artifacts/fedora-package-smoke/*
          if-no-files-found: error

  windows-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application with Windows Media Foundation backend
        shell: powershell
        run: ./tools/setup_windows.ps1
      - name: Install pinned build dependencies
        shell: powershell
        run: |
          ./.venv-windows/Scripts/python.exe -m pip install -r requirements-windows-build.txt
          choco upgrade innosetup --version=6.7.3 --allow-downgrade -y
      - name: Build Windows installer preview
        shell: powershell
        run: |
          ./.venv-windows/Scripts/python.exe tools/build_windows_preview.py `
            --output artifacts/github-windows `
            --iscc "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" `
            --skip-standalone-smoke
      - name: Preserve the exact frozen runtime for desktop acceptance
        shell: powershell
        run: Compress-Archive -Path artifacts/github-windows/dist/AMP -DestinationPath artifacts/github-windows/AMP-Windows-runtime.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AMP-Windows-x64-${{ github.sha }}
          path: |
            artifacts/github-windows/installer/*.exe
            artifacts/github-windows/*.log
            artifacts/github-windows/report.json
            artifacts/github-windows/AMP-Windows-runtime.zip
          if-no-files-found: error

  corresponding-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and assemble the exact corresponding-source set
        run: |
          python tools/source_compliance.py --check-ready
          python tools/source_compliance.py --download artifacts/source-audit/corresponding-source
          git archive --format=tar.gz --prefix=AMP/ -o artifacts/source-audit/corresponding-source/AMP-project-source.tar.gz HEAD
          cp docs/SOURCE_DELIVERY.md artifacts/source-audit/corresponding-source/
          git rev-parse HEAD > artifacts/source-audit/corresponding-source/AMP-COMMIT.txt
          tar -czf artifacts/source-audit/AMP-corresponding-source.tar.gz -C artifacts/source-audit corresponding-source
          cd artifacts/source-audit
          sha256sum AMP-corresponding-source.tar.gz > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AMP-Corresponding-source-${{ github.sha }}
          path: |
            artifacts/source-audit/AMP-corresponding-source.tar.gz
            artifacts/source-audit/SHA256SUMS.txt
          if-no-files-found: error
