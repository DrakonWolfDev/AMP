name: Package previews

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2 libegl1 libopengl0 libgl1 libxcb-cursor0
      - name: Install pinned application and build dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-linux-build.txt
      - name: Build Debian preview
        run: python tools/build_linux_deb.py --output artifacts/github-linux
      - uses: actions/upload-artifact@v4
        with:
          name: AMP-Linux-amd64-${{ github.sha }}
          path: |
            artifacts/github-linux/*.deb
            artifacts/github-linux/*.log
            artifacts/github-linux/report.json
          if-no-files-found: error

  windows-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application with Windows Media Foundation backend
        shell: powershell
        run: ./tools/setup_windows.ps1
      - name: Install pinned build dependencies
        shell: powershell
        run: |
          ./.venv/Scripts/python.exe -m pip install -r requirements-windows-build.txt
          choco upgrade innosetup --version=6.7.3 --allow-downgrade -y
      - name: Build Windows installer preview
        shell: powershell
        run: |
          ./.venv/Scripts/python.exe tools/build_windows_preview.py `
            --output artifacts/github-windows `
            --iscc "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" `
            --skip-standalone-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: AMP-Windows-x64-${{ github.sha }}
          path: |
            artifacts/github-windows/installer/*.exe
            artifacts/github-windows/*.log
            artifacts/github-windows/report.json
          if-no-files-found: error
